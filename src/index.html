<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Abadá Capoeira — Biblioteca Musical</title>
  <base href="/">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real numbers.
       Without it they are all 0, and the bottom tab bar of an installed app ends up
       underneath the iPhone home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Letras completas com tradução em inglês, organizadas por toque. O repertório da Abadá Capoeira.">
  <!-- The card WhatsApp, iMessage and social apps draw for a shared link. Those crawlers
       do not run JavaScript, so this static card is what every shared page shows. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Abadá Música">
  <meta property="og:title" content="Abadá Música — Biblioteca musical da capoeira">
  <meta property="og:description" content="Letras completas com tradução em inglês, organizadas por toque. O repertório da Abadá Capoeira.">
  <meta property="og:image" content="https://abada-musica.vercel.app/hero.jpg">
  <meta property="og:image:width" content="1717">
  <meta property="og:image:height" content="916">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#D4A017">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>

</html>
